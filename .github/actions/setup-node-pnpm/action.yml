name: Setup Node.js and pnpm
description: Set up pnpm and Node.js with the pnpm store cache enabled.

inputs:
  node-version:
    description: Node.js version to use.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
