name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve minor/patch update
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          SHA="$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)"
          for i in $(seq 1 120); do
            check_runs="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate 2>/dev/null || echo '{"check_runs":[]}')"
            statuses="$(gh api "repos/$REPO/commits/$SHA/status" 2>/dev/null || echo '{"statuses":[]}')"
            failed="$(jq -n --argjson cr "$check_runs" --argjson st "$statuses" '
              ([$cr.check_runs[]? | select((.name | test("auto-merge|dependabot|automerge"; "i")) | not) | select(.status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="action_required"))] | length)
              + ([$st.statuses[]? | select((.context | test("auto-merge|dependabot|automerge"; "i")) | not) | select(.state=="failure" or .state=="error")] | length)
            ')"
            pending="$(jq -n --argjson cr "$check_runs" --argjson st "$statuses" '
              ([$cr.check_runs[]? | select((.name | test("auto-merge|dependabot|automerge"; "i")) | not) | select(.status!="completed")] | length)
              + ([$st.statuses[]? | select((.context | test("auto-merge|dependabot|automerge"; "i")) | not) | select(.state=="pending")] | length)
            ')"
            if [ "$failed" -gt 0 ]; then
              echo "CI checks failed"
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "CI checks complete"
              break
            fi
            sleep 10
          done
      - name: Merge (squash)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
